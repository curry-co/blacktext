name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # "mac" is a required check on main; renaming the job means updating the ruleset.
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: swift test

      - name: Build BlackText.app
        run: scripts/build-app.sh

      - name: Quick benchmark (one year of notes)
        # Shared runners are noisy, so timings are reported, not enforced.
        continue-on-error: true
        run: YEARS=1 WORDS=2000 scripts/bench.sh
